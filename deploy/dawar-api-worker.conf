; Queue worker for the Dawar API (Excel exports and future notifications).
;
; Copy to /etc/supervisor/conf.d/ then:
;   supervisorctl reread && supervisorctl update && supervisorctl start dawar-api-worker
;
; After every deploy run `php artisan queue:restart` — the worker keeps code
; and cached config in memory.

[program:dawar-api-worker]
process_name=%(program_name)s_%(process_num)02d
directory=/home/dawar-api/htdocs/api.dawar.app
command=php artisan queue:work --sleep=3 --tries=3 --max-time=3600
user=dawar-api
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/home/dawar-api/htdocs/api.dawar.app/storage/logs/worker.log
