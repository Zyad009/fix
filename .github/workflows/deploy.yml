name: Deploy Backend

# Runs after CI succeeds on main. Fill the repository secrets SERVER_HOST,
# SERVER_USER, SERVER_SSH_KEY and adjust APP_DIR to the server layout.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            APP_DIR="${APP_DIR:-/home/dawar-api/htdocs/api.dawar.app}"
            cd "$APP_DIR"

            echo "📥 Updating source..."
            git fetch origin main
            git reset --hard origin/main

            echo "📦 Installing dependencies..."
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

            echo "🗄️ Migrating..."
            php artisan optimize:clear
            php artisan migrate --force
            php artisan db:seed --class="Database\Seeders\CarCatalogSeeder" --force
            php artisan storage:link || true

            echo "⚡ Optimizing..."
            php artisan optimize

            echo "🔄 Restarting queue workers..."
            php artisan queue:restart

            echo "✅ Dawar deployment completed."
